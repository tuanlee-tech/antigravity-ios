name: Build and Release Antigravity iOS (.ipa)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.4.1)'
        required: false
        default: 'v2.4.1'

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned / Sideloadable .ipa on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen & ldid
        run: |
          brew install xcodegen ldid

      - name: Configure Official Antigravity Google OAuth into Info.plist
        env:
          AGY_OAUTH_CLIENT_ID: ${{ secrets.AGY_OAUTH_CLIENT_ID }}
          AGY_OAUTH_CLIENT_SECRET: ${{ secrets.AGY_OAUTH_CLIENT_SECRET }}
        run: |
          python3 - << 'EOF'
          import json, os, re, subprocess, urllib.request

          cid = os.environ.get("AGY_OAUTH_CLIENT_ID", "").strip()
          csec = os.environ.get("AGY_OAUTH_CLIENT_SECRET", "").strip()

          if not cid or not csec:
              print("[*] Resolving official Antigravity OAuth parameters from upstream release...")
              rel_url = "https://antigravity-hub-auto-updater-974169037036.us-central1.run.app/releases"
              with urllib.request.urlopen(rel_url, timeout=30) as r:
                  releases = json.loads(r.read().decode("utf-8"))
              latest = releases[0]
              bin_url = f"https://storage.googleapis.com/antigravity-public/antigravity-hub/{latest['version']}-{latest['execution_id']}/unsigned/language_server-linux-x64"
              tmp_bin = "/tmp/ls_upstream"
              urllib.request.urlretrieve(bin_url, tmp_bin)
              with open(tmp_bin, "rb") as f:
                  data = f.read()
              os.remove(tmp_bin)
              cids = re.findall(rb"1071006060591-[a-z0-9]+\.apps\.googleusercontent\.com", data)
              csecs = re.findall(rb"GOCSPX-[A-Za-z0-9_-]{28}", data)
              if cids and not cid:
                  cid = cids[0].decode("ascii")
              if csecs and not csec:
                  # Pick the Cloud Code client secret (the second GOCSPX or matching K58F...)
                  csec = csecs[-1].decode("ascii")

          plist = "ios/AntigravityIOS/Info.plist"
          for key, val in [("AGYOAuthClientId", cid), ("AGYOAuthClientSecret", csec)]:
              if val:
                  res = subprocess.run(["/usr/libexec/PlistBuddy", "-c", f"Set :{key} {val}", plist], capture_output=True)
                  if res.returncode != 0:
                      subprocess.check_call(["/usr/libexec/PlistBuddy", "-c", f"Add :{key} string {val}", plist])
          print(f"[OK] Configured Info.plist OAuth (client_id present={bool(cid)}, secret present={bool(csec)})")
          EOF

      - name: Generate Xcode Project
        working-directory: ios
        run: |
          xcodegen generate

      - name: Build iOS App Bundle (arm64)
        working-directory: ios
        run: |
          xcodebuild \
            -project AntigravityIOS.xcodeproj \
            -scheme AntigravityIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package & Ad-Hoc Sign antigravity-ios.ipa
        run: |
          mkdir -p dist/Payload
          APP_PATH=$(find ios/build -name "Antigravity.app" -type d | head -n 1)
          cp -R "$APP_PATH" dist/Payload/Antigravity.app
          ldid -S dist/Payload/Antigravity.app/Antigravity
          cd dist
          zip -r9 antigravity-ios.ipa Payload
          shasum -a 256 antigravity-ios.ipa > SHA256SUMS.txt
          ls -lh antigravity-ios.ipa

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-ios-ipa
          path: |
            dist/antigravity-ios.ipa
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release (Public .ipa Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v2.4.1' }}
          name: "Antigravity for iOS (${{ github.event.inputs.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v2.4.1' }})"
          make_latest: true
          files: |
            dist/antigravity-ios.ipa
            dist/SHA256SUMS.txt
          body: |
            ### ⚡ Antigravity for iOS — Ready to Sideload (`.ipa`)

            - **1-Click Sign in with Google:** Đăng nhập trực tiếp tài khoản Google Antigravity của bạn, tự động nhận diện Tier (Free / Pro / Ultra) và danh sách Model tương ứng.
            - **On-Device Git & Folder Picker:** Nhắn chat `git clone ...` trực tiếp trên iPhone, sau đó bấm **📂 Open Folder** để chọn thư mục và vibecode với `/grill-me`.
            - **Cài đặt:** Tải `antigravity-ios.ipa` bên dưới và cài qua **Sideloadly**, **AltStore**, **SideStore**, hoặc **TrollStore**.
